version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fmcg_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fmcg_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fmcg_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fmcg_backend
    environment:
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-fmcg_ai}
      USE_SQLITE: "False"
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: INFO
    volumes:
      - ./logs:/app/logs
      - ../architecture:/app/architecture:ro
      - ../ai_agent:/app/ai_agent:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fmcg_network
    command: >
      sh -c "
      python -m pip install -q psycopg2-binary &&
      python main.py
      "

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: fmcg_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fmcg_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for Database Management (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fmcg_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fmcg.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - fmcg_network

volumes:
  postgres_data:
  redis_data:

networks:
  fmcg_network:
    driver: bridge
